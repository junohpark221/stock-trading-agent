{% extends "base.html" %}

{% block title %}계좌 수정 - {{ account.nickname }} - Trading Agent{% endblock %}

{% block content %}
<h2>계좌 수정: {{ account.nickname }}</h2>

{% if error %}
<article style="background: #dc3545; color: #fff; padding: 0.5rem 1rem;">
    {{ error }}
</article>
{% endif %}

<form method="post" action="/admin/accounts/{{ account.id }}/edit">
    <div class="grid">
        <label>
            계좌 ID
            <input type="text" value="{{ account.id }}" disabled>
        </label>
        <label>
            닉네임
            <input type="text" name="nickname" value="{{ account.nickname }}" maxlength="50">
        </label>
    </div>

    <div class="grid">
        <label>
            전략
            <select name="strategy_type">
                {% for st in strategy_types %}
                <option value="{{ st }}" {% if account.strategy_type == st %}selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <input type="checkbox" name="kis_is_paper" {% if account.kis_is_paper %}checked{% endif %}>
            모의투자
        </label>
    </div>

    <div class="grid">
        <label>
            KIS App Key
            <input type="password" name="kis_app_key" placeholder="변경 시에만 입력">
        </label>
        <label>
            KIS App Secret
            <input type="password" name="kis_app_secret" placeholder="변경 시에만 입력">
        </label>
    </div>

    <div class="grid">
        <label>
            계좌번호
            <input type="text" name="kis_account_no" value="{{ account.kis_account_no }}" maxlength="20">
        </label>
        <label>
            계좌 상품코드
            <input type="text" name="kis_account_prod" value="{{ account.kis_account_prod }}" maxlength="5">
        </label>
        <label>
            HTS ID
            <input type="text" name="kis_hts_id" value="{{ account.kis_hts_id or '' }}" maxlength="50">
        </label>
    </div>

    <label>
        투자 철학 프롬프트
        <textarea name="investment_prompt" rows="4">{{ account.investment_prompt or '' }}</textarea>
    </label>

    <label>
        리스크 오버라이드 (JSON)
        <textarea name="risk_overrides" rows="3">{{ account.risk_overrides | tojson if account.risk_overrides else '' }}</textarea>
    </label>

    <div class="grid">
        <button type="submit">저장</button>
        <a href="/admin/accounts" role="button" class="secondary">취소</a>
    </div>
</form>

<p><a href="/admin/accounts/{{ account.id }}">&rarr; 계좌 상세 보기</a></p>
{% endblock %}
