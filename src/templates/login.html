{% extends "base.html" %}

{% block title %}로그인 - Trading Agent{% endblock %}

{% block content %}
<div class="login-container">
    <article>
        <header>
            <h2>관리자 로그인</h2>
        </header>
        {% if request.query_params.get('error') %}
        <div class="alert alert-error">비밀번호가 올바르지 않습니다.</div>
        {% endif %}
        <form method="POST" action="/admin/login">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password"
                   placeholder="관리자 비밀번호" required autofocus>
            <button type="submit">로그인</button>
        </form>
    </article>
</div>
{% endblock %}
