{% extends "base.html" %}

{% block title %}성과 분석 - Trading Agent{% endblock %}

{% block content %}
<h2>성과 분석</h2>

<!-- 필터 -->
<form hx-get="/admin/performance" hx-target="#performance-content" hx-trigger="change" hx-push-url="true">
    <div class="grid">
        <label>
            계좌
            <select name="account_id">
                <option value="">전체</option>
                {% for acct in accounts %}
                <option value="{{ acct.id }}" {% if account_id == acct.id %}selected{% endif %}>
                    {{ acct.nickname }}
                </option>
                {% endfor %}
            </select>
        </label>
        <label>
            시작일
            <input type="date" name="from_date" value="{{ from_date }}">
        </label>
        <label>
            종료일
            <input type="date" name="to_date" value="{{ to_date }}">
        </label>
    </div>
</form>

<!-- 성과 콘텐츠 (HTMX 교체 대상) -->
<div id="performance-content">
    {% include "partials/performance_content.html" %}
</div>
{% endblock %}
